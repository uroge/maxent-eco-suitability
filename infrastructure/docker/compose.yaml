services:
  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?Set NEXT_PUBLIC_API_URL in infrastructure/docker/.env.local}
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY:?Set CLERK_PUBLISHABLE_KEY in infrastructure/docker/.env.local}
        CLIENT_BRAND: ${CLIENT_BRAND:-}
    ports: ['3000:3000']
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    environment:
      APP_ENV: development
      PORT: 3001
      MAX_JSON_BODY_BYTES: ${MAX_JSON_BODY_BYTES:-1048576}
      HTTP_HEADERS_TIMEOUT_MS: ${HTTP_HEADERS_TIMEOUT_MS:-15000}
      HTTP_REQUEST_TIMEOUT_MS: ${HTTP_REQUEST_TIMEOUT_MS:-30000}
      HTTP_KEEP_ALIVE_TIMEOUT_MS: ${HTTP_KEEP_ALIVE_TIMEOUT_MS:-5000}
      REDIS_URL: ${REDIS_URL:?Set REDIS_URL in infrastructure/docker/.env.local}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:?Set CLERK_SECRET_KEY in infrastructure/docker/.env.local}
      CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY:?Set CLERK_PUBLISHABLE_KEY in infrastructure/docker/.env.local}
      CLERK_AUTHORIZED_PARTIES: ${CLERK_AUTHORIZED_PARTIES:?Set CLERK_AUTHORIZED_PARTIES in infrastructure/docker/.env.local}
      API_CORS_ORIGINS: ${API_CORS_ORIGINS:?Set API_CORS_ORIGINS in infrastructure/docker/.env.local}
      TRUST_PROXY_CIDRS: ${TRUST_PROXY_CIDRS:-127.0.0.1/32,::1/128}
      METRICS_TOKEN: ${METRICS_TOKEN:?Set METRICS_TOKEN in infrastructure/docker/.env.local}
      STORAGE_PROVIDER: seaweedfs
      STORAGE_INTERNAL_ENDPOINT: http://seaweedfs:8333
      STORAGE_PRESIGN_ENDPOINT: http://localhost:8333
      STORAGE_BUCKET: ${STORAGE_BUCKET:?Set STORAGE_BUCKET in infrastructure/docker/.env.local}
      STORAGE_REGION: us-east-1
      STORAGE_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY_ID:?Set STORAGE_ACCESS_KEY_ID in infrastructure/docker/.env.local}
      STORAGE_SECRET_ACCESS_KEY: ${STORAGE_SECRET_ACCESS_KEY:?Set STORAGE_SECRET_ACCESS_KEY in infrastructure/docker/.env.local}
      STORAGE_FORCE_PATH_STYLE: 'true'
    ports: ['3001:3001']
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
  worker:
    build:
      context: ../..
      dockerfile: apps/worker/Dockerfile
    environment:
      APP_ENV: development
      REDIS_URL: ${REDIS_URL:?Set REDIS_URL in infrastructure/docker/.env.local}
      WORKER_METRICS_TOKEN: ${WORKER_METRICS_TOKEN:?Set WORKER_METRICS_TOKEN in infrastructure/docker/.env.local}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
  redis:
    image: redis:8-alpine@sha256:9c3ecc609a8087c0f11c494fefaf37a8f7bf9a967631d4a0da8967a9810be354
    ports: ['6379:6379']
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
  seaweedfs:
    image: chrislusf/seaweedfs:4.44
    environment:
      AWS_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY_ID:?Set STORAGE_ACCESS_KEY_ID in infrastructure/docker/.env.local}
      AWS_SECRET_ACCESS_KEY: ${STORAGE_SECRET_ACCESS_KEY:?Set STORAGE_SECRET_ACCESS_KEY in infrastructure/docker/.env.local}
      S3_BUCKET: ${STORAGE_BUCKET:?Set STORAGE_BUCKET in infrastructure/docker/.env.local}
    ports: ['127.0.0.1:8333:8333']
    volumes: ['seaweedfs-data:/data']
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://localhost:8333/']
      interval: 5s
      timeout: 3s
      retries: 10
  analysis-r:
    profiles: ['analysis']
    build:
      context: ../..
      dockerfile: services/analysis-r/Dockerfile
    command: ['sh', '-c', 'tail -f /dev/null']
volumes:
  seaweedfs-data:
