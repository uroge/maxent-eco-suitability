services:
  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?Set NEXT_PUBLIC_API_URL in infrastructure/docker/.env.local}
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY:?Set CLERK_PUBLISHABLE_KEY in infrastructure/docker/.env.local}
        CLIENT_BRAND: ${CLIENT_BRAND:-}
    ports: ['3000:3000']
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    environment:
      APP_ENV: development
      PORT: 3001
      MAX_JSON_BODY_BYTES: ${MAX_JSON_BODY_BYTES:-1048576}
      HTTP_HEADERS_TIMEOUT_MS: ${HTTP_HEADERS_TIMEOUT_MS:-15000}
      HTTP_REQUEST_TIMEOUT_MS: ${HTTP_REQUEST_TIMEOUT_MS:-30000}
      HTTP_KEEP_ALIVE_TIMEOUT_MS: ${HTTP_KEEP_ALIVE_TIMEOUT_MS:-5000}
      REDIS_URL: ${REDIS_URL:?Set REDIS_URL in infrastructure/docker/.env.local}
      REDIS_DURABILITY_MODE: ${REDIS_DURABILITY_MODE:-required}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:?Set CLERK_SECRET_KEY in infrastructure/docker/.env.local}
      CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY:?Set CLERK_PUBLISHABLE_KEY in infrastructure/docker/.env.local}
      CLERK_AUTHORIZED_PARTIES: ${CLERK_AUTHORIZED_PARTIES:?Set CLERK_AUTHORIZED_PARTIES in infrastructure/docker/.env.local}
      API_CORS_ORIGINS: ${API_CORS_ORIGINS:?Set API_CORS_ORIGINS in infrastructure/docker/.env.local}
      TRUST_PROXY_CIDRS: ${TRUST_PROXY_CIDRS:-127.0.0.1/32,::1/128}
      METRICS_TOKEN: ${METRICS_TOKEN:?Set METRICS_TOKEN in infrastructure/docker/.env.local}
      STORAGE_PROVIDER: seaweedfs
      STORAGE_INTERNAL_ENDPOINT: http://seaweedfs:8333
      STORAGE_PRESIGN_ENDPOINT: http://localhost:8333
      STORAGE_BUCKET: ${STORAGE_BUCKET:?Set STORAGE_BUCKET in infrastructure/docker/.env.local}
      STORAGE_REGION: us-east-1
      STORAGE_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY_ID:?Set STORAGE_ACCESS_KEY_ID in infrastructure/docker/.env.local}
      STORAGE_SECRET_ACCESS_KEY: ${STORAGE_SECRET_ACCESS_KEY:?Set STORAGE_SECRET_ACCESS_KEY in infrastructure/docker/.env.local}
      STORAGE_CORS_ORIGINS: ${STORAGE_CORS_ORIGINS:-http://localhost:3000}
      STORAGE_FORCE_PATH_STYLE: 'true'
      ANALYSIS_EXECUTION_TIMEOUT_MS: ${ANALYSIS_EXECUTION_TIMEOUT_MS:-1800000}
      TILE_SERVICE_URL: http://tiles:8081
      TILE_INTERNAL_SHARED_SECRET: ${TILE_INTERNAL_SHARED_SECRET:?Set TILE_INTERNAL_SHARED_SECRET in infrastructure/docker/.env.local}
      TILE_REQUEST_TIMEOUT_MS: ${TILE_REQUEST_TIMEOUT_MS:-5000}
      TILE_RESPONSE_MAX_BYTES: ${TILE_RESPONSE_MAX_BYTES:-2097152}
      MAP_LIGHT_STYLE_URL: ${MAP_LIGHT_STYLE_URL:-}
      MAP_DARK_STYLE_URL: ${MAP_DARK_STYLE_URL:-}
      MAP_LIGHT_ATTRIBUTION: ${MAP_LIGHT_ATTRIBUTION:-}
      MAP_SATELLITE_STYLE_URL: ${MAP_SATELLITE_STYLE_URL:-}
      MAP_SATELLITE_ATTRIBUTION: ${MAP_SATELLITE_ATTRIBUTION:-}
      MAP_TERRAIN_STYLE_URL: ${MAP_TERRAIN_STYLE_URL:-}
      MAP_TERRAIN_ATTRIBUTION: ${MAP_TERRAIN_ATTRIBUTION:-}
    ports: ['3001:3001']
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
      tiles:
        condition: service_healthy
  worker:
    build:
      context: ../..
      dockerfile: apps/worker/Dockerfile
    environment:
      APP_ENV: development
      REDIS_URL: ${REDIS_URL:?Set REDIS_URL in infrastructure/docker/.env.local}
      WORKER_METRICS_TOKEN: ${WORKER_METRICS_TOKEN:?Set WORKER_METRICS_TOKEN in infrastructure/docker/.env.local}
      ANALYSIS_EXECUTION_TIMEOUT_MS: ${ANALYSIS_EXECUTION_TIMEOUT_MS:-1800000}
      STORAGE_INTERNAL_ENDPOINT: http://seaweedfs:8333
      STORAGE_REGION: us-east-1
      STORAGE_BUCKET: ${STORAGE_BUCKET:?Set STORAGE_BUCKET in infrastructure/docker/.env.local}
      STORAGE_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY_ID:?Set STORAGE_ACCESS_KEY_ID in infrastructure/docker/.env.local}
      STORAGE_SECRET_ACCESS_KEY: ${STORAGE_SECRET_ACCESS_KEY:?Set STORAGE_SECRET_ACCESS_KEY in infrastructure/docker/.env.local}
      STORAGE_FORCE_PATH_STYLE: 'true'
      R_RUNTIME_URL: http://analysis-r:8080
      R_RUNTIME_SHARED_SECRET: ${R_RUNTIME_SHARED_SECRET:?Set R_RUNTIME_SHARED_SECRET in infrastructure/docker/.env.local}
      R_RUNTIME_HTTP_TIMEOUT_MS: ${R_RUNTIME_HTTP_TIMEOUT_MS:-10000}
      R_RUNTIME_RUN_TIMEOUT_MS: ${R_RUNTIME_RUN_TIMEOUT_MS:-1800000}
      R_RUNTIME_INPUT_URL_TTL_SECONDS: ${R_RUNTIME_INPUT_URL_TTL_SECONDS:-900}
      R_RUNTIME_OUTPUT_URL_TTL_SECONDS: ${R_RUNTIME_OUTPUT_URL_TTL_SECONDS:-900}
    depends_on:
      redis:
        condition: service_healthy
      analysis-r:
        condition: service_healthy
    restart: unless-stopped
  redis:
    image: redis:8-alpine@sha256:9c3ecc609a8087c0f11c494fefaf37a8f7bf9a967631d4a0da8967a9810be354
    ports: ['6379:6379']
    command:
      [
        'redis-server',
        '--appendonly',
        'yes',
        '--appendfsync',
        'everysec',
        '--maxmemory-policy',
        'noeviction',
      ]
    volumes: ['redis-data:/data']
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
  seaweedfs:
    image: chrislusf/seaweedfs:4.44@sha256:e67e8c385484120b78bff47ba5f4debbca47fbd27ed1a39f016f47e8baea615b
    entrypoint: ['/bin/sh', '-ec']
    command:
      - |
        cat >/tmp/s3.json <<EOF
        {"identities":[{"name":"ecosuitability","credentials":[{"accessKey":"${STORAGE_ACCESS_KEY_ID:?Set STORAGE_ACCESS_KEY_ID in infrastructure/docker/.env.local}","secretKey":"${STORAGE_SECRET_ACCESS_KEY:?Set STORAGE_SECRET_ACCESS_KEY in infrastructure/docker/.env.local}"}],"actions":["Admin","Read","List","Tagging","Write"]}]}
        EOF
        exec weed server -dir=/data -filer -s3 -s3.port=8333 -s3.config=/tmp/s3.json
    ports: ['127.0.0.1:8333:8333']
    volumes: ['seaweedfs-data:/data']
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:8333/']
      interval: 5s
      timeout: 3s
      retries: 10
  analysis-r:
    build:
      context: ../../services/analysis-r
      dockerfile: Dockerfile
    environment:
      R_RUNTIME_PORT: 8080
      R_RUNTIME_SHARED_SECRET: ${R_RUNTIME_SHARED_SECRET:?Set R_RUNTIME_SHARED_SECRET in infrastructure/docker/.env.local}
      R_RUNTIME_WORKSPACE_ROOT: /workspaces
      R_RUNTIME_WORKSPACE_QUOTA_BYTES: ${R_RUNTIME_WORKSPACE_QUOTA_BYTES:-6442450944}
      R_RUNTIME_CHILD_MEMORY_BYTES: ${R_RUNTIME_CHILD_MEMORY_BYTES:-2147483648}
      R_RUNTIME_RUN_TIMEOUT_MS: ${R_RUNTIME_RUN_TIMEOUT_MS:-1800000}
    read_only: true
    cap_drop: ['ALL']
    security_opt: ['no-new-privileges:true']
    tmpfs: ['/run/analysis-r:uid=10001,gid=10001,mode=0700,size=16m']
    volumes: ['analysis-r-workspaces:/workspaces']
    mem_limit: 3g
    cpus: 2
    pids_limit: 128
    ulimits:
      nofile: 256
    restart: unless-stopped
  tiles:
    build:
      context: ../../services/tiles
      dockerfile: Dockerfile
    environment:
      TILE_INTERNAL_SHARED_SECRET: ${TILE_INTERNAL_SHARED_SECRET:?Set TILE_INTERNAL_SHARED_SECRET in infrastructure/docker/.env.local}
      STORAGE_BUCKET: ${STORAGE_BUCKET:?Set STORAGE_BUCKET in infrastructure/docker/.env.local}
      AWS_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY_ID:?Set STORAGE_ACCESS_KEY_ID in infrastructure/docker/.env.local}
      AWS_SECRET_ACCESS_KEY: ${STORAGE_SECRET_ACCESS_KEY:?Set STORAGE_SECRET_ACCESS_KEY in infrastructure/docker/.env.local}
      AWS_REGION: us-east-1
      AWS_ENDPOINT_URL: http://seaweedfs:8333
      AWS_S3_ENDPOINT: seaweedfs:8333
      AWS_HTTPS: 'NO'
      AWS_VIRTUAL_HOSTING: 'FALSE'
      GDAL_DISABLE_READDIR_ON_OPEN: EMPTY_DIR
      CPL_VSIL_CURL_ALLOWED_EXTENSIONS: .tif,.tiff
    read_only: true
    cap_drop: ['ALL']
    security_opt: ['no-new-privileges:true']
    tmpfs: ['/tmp:uid=10002,gid=10002,mode=0700,size=64m']
    mem_limit: 1g
    cpus: 1
    pids_limit: 128
    depends_on:
      seaweedfs:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/health/ready')",
        ]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped
volumes:
  redis-data:
  seaweedfs-data:
  analysis-r-workspaces:
