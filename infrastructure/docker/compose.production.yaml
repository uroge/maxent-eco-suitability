services:
  caddy:
    image: caddy:2.11.2-alpine
    ports: ['80:80', '443:443']
    environment:
      CADDY_EMAIL: ${CADDY_EMAIL:?Set CADDY_EMAIL in the production environment}
      WEB_DOMAIN: ${WEB_DOMAIN:?Set WEB_DOMAIN in the production environment}
      API_DOMAIN: ${API_DOMAIN:?Set API_DOMAIN in the production environment}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - web
      - api
    restart: unless-stopped

  web:
    ports: []
    read_only: true
    cap_drop: ['ALL']
    security_opt: ['no-new-privileges:true']
    tmpfs: ['/tmp']

  api:
    environment:
      APP_ENV: production
    ports: []
    read_only: true
    cap_drop: ['ALL']
    security_opt: ['no-new-privileges:true']
    tmpfs: ['/tmp']

  worker:
    environment:
      APP_ENV: production
    ports: []
    read_only: true
    cap_drop: ['ALL']
    security_opt: ['no-new-privileges:true']
    tmpfs: ['/tmp']

volumes:
  caddy-data:
  caddy-config:
