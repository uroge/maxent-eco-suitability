services:
  caddy:
    image: caddy:2.11.2-alpine@sha256:6d125e80883be8a2bef5f088c7535945b42cdbb8a0f5471bf36eaf18dc0638f1
    ports: ['80:80', '443:443']
    environment:
      CADDY_EMAIL: ${CADDY_EMAIL:?Set CADDY_EMAIL in the production environment}
      WEB_DOMAIN: ${WEB_DOMAIN:?Set WEB_DOMAIN in the production environment}
      API_DOMAIN: ${API_DOMAIN:?Set API_DOMAIN in the production environment}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - web
      - api
    restart: unless-stopped
    networks:
      edge:
        ipv4_address: 172.30.0.2

  web:
    ports: !reset []
    read_only: true
    cap_drop: ['ALL']
    security_opt: ['no-new-privileges:true']
    tmpfs: ['/tmp']
    networks: [edge]

  api:
    ports: !reset []
    read_only: true
    cap_drop: ['ALL']
    security_opt: ['no-new-privileges:true']
    tmpfs: ['/tmp']
    environment:
      APP_ENV: production
      TRUST_PROXY_CIDRS: 172.30.0.2/32
    networks:
      edge:
        ipv4_address: 172.30.0.3
      backend: {}

  worker:
    environment:
      APP_ENV: production
    ports: !reset []
    read_only: true
    cap_drop: ['ALL']
    security_opt: ['no-new-privileges:true']
    tmpfs: ['/tmp']
    networks: [backend]

  redis:
    ports: !reset []
    networks: [backend]

  minio:
    ports: !reset []
    networks: [backend]

volumes:
  caddy-data:
  caddy-config:

networks:
  edge:
    internal: true
    ipam:
      config:
        - subnet: 172.30.0.0/24
  backend:
    internal: true
