services:
  caddy:
    image: caddy:2.11.2-alpine@sha256:6d125e80883be8a2bef5f088c7535945b42cdbb8a0f5471bf36eaf18dc0638f1
    ports: ['80:80', '443:443']
    environment:
      CADDY_EMAIL: ${CADDY_EMAIL:?Set CADDY_EMAIL in the production environment}
      WEB_DOMAIN: ${WEB_DOMAIN:?Set WEB_DOMAIN in the production environment}
      API_DOMAIN: ${API_DOMAIN:?Set API_DOMAIN in the production environment}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - web
      - api
    restart: unless-stopped
    networks:
      edge:
        ipv4_address: 172.30.0.2

  web:
    ports: !reset []
    read_only: true
    cap_drop: ['ALL']
    security_opt: ['no-new-privileges:true']
    tmpfs: ['/tmp']
    networks: [edge]

  api:
    ports: !reset []
    depends_on: !reset
      redis:
        condition: service_healthy
    read_only: true
    cap_drop: ['ALL']
    security_opt: ['no-new-privileges:true']
    tmpfs: ['/tmp']
    environment:
      APP_ENV: production
      REDIS_DURABILITY_MODE: required
      TRUST_PROXY_CIDRS: 172.30.0.2/32
      STORAGE_PROVIDER: r2
      STORAGE_INTERNAL_ENDPOINT: ${STORAGE_INTERNAL_ENDPOINT:?Set the R2 endpoint in the production environment}
      STORAGE_PRESIGN_ENDPOINT: ${STORAGE_PRESIGN_ENDPOINT:?Set the R2 presign endpoint in the production environment}
      STORAGE_BUCKET: ${STORAGE_BUCKET:?Set the R2 bucket in the production environment}
      STORAGE_REGION: auto
      STORAGE_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY_ID:?Set the R2 access key in the production environment}
      STORAGE_SECRET_ACCESS_KEY: ${STORAGE_SECRET_ACCESS_KEY:?Set the R2 secret in the production environment}
      STORAGE_CORS_ORIGINS: ${STORAGE_CORS_ORIGINS:?Set the R2 CORS origins in the production environment}
      STORAGE_FORCE_PATH_STYLE: 'false'
      TILE_SERVICE_URL: http://tiles:8081
      TILE_INTERNAL_SHARED_SECRET: ${TILE_INTERNAL_SHARED_SECRET:?Set TILE_INTERNAL_SHARED_SECRET in production}
      MAP_LIGHT_STYLE_URL: ${MAP_LIGHT_STYLE_URL:-}
      MAP_DARK_STYLE_URL: ${MAP_DARK_STYLE_URL:-}
      MAP_LIGHT_ATTRIBUTION: ${MAP_LIGHT_ATTRIBUTION:-}
      MAP_SATELLITE_STYLE_URL: ${MAP_SATELLITE_STYLE_URL:-}
      MAP_SATELLITE_ATTRIBUTION: ${MAP_SATELLITE_ATTRIBUTION:-}
      MAP_TERRAIN_STYLE_URL: ${MAP_TERRAIN_STYLE_URL:-}
      MAP_TERRAIN_ATTRIBUTION: ${MAP_TERRAIN_ATTRIBUTION:-}
    networks:
      edge:
        ipv4_address: 172.30.0.3
      backend: {}

  worker:
    environment:
      APP_ENV: production
      STORAGE_INTERNAL_ENDPOINT: ${STORAGE_INTERNAL_ENDPOINT:?Set the R2 endpoint in the production environment}
      STORAGE_REGION: auto
      STORAGE_BUCKET: ${STORAGE_BUCKET:?Set the R2 bucket in the production environment}
      STORAGE_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY_ID:?Set the R2 access key in the production environment}
      STORAGE_SECRET_ACCESS_KEY: ${STORAGE_SECRET_ACCESS_KEY:?Set the R2 secret in the production environment}
      STORAGE_FORCE_PATH_STYLE: 'false'
      R_RUNTIME_URL: http://analysis-r:8080
      R_RUNTIME_SHARED_SECRET: ${R_RUNTIME_SHARED_SECRET:?Set R_RUNTIME_SHARED_SECRET in the production environment}
      R_RUNTIME_HTTP_TIMEOUT_MS: ${R_RUNTIME_HTTP_TIMEOUT_MS:-10000}
      R_RUNTIME_RUN_TIMEOUT_MS: ${R_RUNTIME_RUN_TIMEOUT_MS:-1800000}
      R_RUNTIME_INPUT_URL_TTL_SECONDS: ${R_RUNTIME_INPUT_URL_TTL_SECONDS:-900}
      R_RUNTIME_OUTPUT_URL_TTL_SECONDS: ${R_RUNTIME_OUTPUT_URL_TTL_SECONDS:-900}
    ports: !reset []
    read_only: true
    cap_drop: ['ALL']
    security_opt: ['no-new-privileges:true']
    tmpfs: ['/tmp']
    networks: [backend]

  analysis-r:
    environment:
      R_RUNTIME_PORT: 8080
      R_RUNTIME_SHARED_SECRET: ${R_RUNTIME_SHARED_SECRET:?Set R_RUNTIME_SHARED_SECRET in the production environment}
      R_RUNTIME_WORKSPACE_ROOT: /workspaces
      R_RUNTIME_WORKSPACE_QUOTA_BYTES: ${R_RUNTIME_WORKSPACE_QUOTA_BYTES:-6442450944}
      R_RUNTIME_CHILD_MEMORY_BYTES: ${R_RUNTIME_CHILD_MEMORY_BYTES:-2147483648}
      R_RUNTIME_RUN_TIMEOUT_MS: ${R_RUNTIME_RUN_TIMEOUT_MS:-1800000}
    ports: !reset []
    networks: [backend]

  tiles:
    depends_on: !reset []
    environment:
      TILE_INTERNAL_SHARED_SECRET: ${TILE_INTERNAL_SHARED_SECRET:?Set TILE_INTERNAL_SHARED_SECRET in production}
      STORAGE_BUCKET: ${STORAGE_BUCKET:?Set the R2 bucket in production}
      AWS_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY_ID:?Set the R2 access key in production}
      AWS_SECRET_ACCESS_KEY: ${STORAGE_SECRET_ACCESS_KEY:?Set the R2 secret in production}
      AWS_REGION: auto
      AWS_ENDPOINT_URL: ${STORAGE_INTERNAL_ENDPOINT:?Set the R2 endpoint in production}
      AWS_VIRTUAL_HOSTING: 'TRUE'
    ports: !reset []
    networks: [backend]

  redis:
    ports: !reset []
    networks: [backend]

  seaweedfs:
    ports: !reset []
    profiles: ['local-storage']
    networks: [backend]

volumes:
  caddy-data:
  caddy-config:
  analysis-r-workspaces:

networks:
  edge:
    internal: true
    ipam:
      config:
        - subnet: 172.30.0.0/24
  backend:
    internal: true
