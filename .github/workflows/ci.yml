name: CI
on: [pull_request, push]
jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_URL: http://localhost:3001
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ci_placeholder
      CLERK_PUBLISHABLE_KEY: pk_test_ci_placeholder
      CLERK_SECRET_KEY: sk_test_ci_placeholder
      CLERK_AUTHORIZED_PARTIES: http://localhost:3000
      API_CORS_ORIGINS: http://localhost:3000
      TRUST_PROXY_CIDRS: 127.0.0.1/32,::1/128
      METRICS_TOKEN: ci-metrics-token-with-at-least-32-characters
      WORKER_METRICS_TOKEN: ci-worker-metrics-token-with-32-characters
      REDIS_URL: redis://redis:6379
      RUN_REDIS_INTEGRATION: 'true'
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with: { node-version: 24.19.0, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
      - run: docker compose -p ecosuitability -f infrastructure/docker/compose.yaml build web api worker
      - run: pnpm container:check
      - name: Scan container configuration and secrets
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          exit-code: '1'
          severity: CRITICAL,HIGH
      - name: Report API image vulnerabilities
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: ecosuitability-api
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
