name: CI
on:
  pull_request:
  push:
    branches: [dev]
jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_URL: http://localhost:3001
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_TEST_PUBLISHABLE_KEY || 'pk_test_ZXhhbXBsZS5jbGVyay5hY2NvdW50cy5kZXYk' }}
      CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_TEST_PUBLISHABLE_KEY || 'pk_test_ZXhhbXBsZS5jbGVyay5hY2NvdW50cy5kZXYk' }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_TEST_SECRET_KEY || 'sk_test_ci_placeholder' }}
      CLERK_AUTHORIZED_PARTIES: http://localhost:3000
      API_CORS_ORIGINS: http://localhost:3000
      TRUST_PROXY_CIDRS: 127.0.0.1/32,::1/128
      METRICS_TOKEN: ci-metrics-token-with-at-least-32-characters
      WORKER_METRICS_TOKEN: ci-worker-metrics-token-with-32-characters
      REDIS_URL: redis://redis:6379
      RUN_REDIS_INTEGRATION: 'true'
      RUN_STORAGE_INTEGRATION: 'true'
      STORAGE_BUCKET: ecosuitability
      STORAGE_ACCESS_KEY_ID: ci-storage-access-key
      STORAGE_SECRET_ACCESS_KEY: ci-storage-secret-key
      STORAGE_CORS_ORIGINS: http://localhost:3000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 24.19.0, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
      - run: docker compose -p ecosuitability -f infrastructure/docker/compose.yaml build web api worker
      - run: pnpm container:check
      - name: Scan container configuration and secrets
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          skip-dirs: node_modules
          exit-code: '1'
          severity: CRITICAL,HIGH
      - name: Report API image vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ecosuitability-api
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
      - id: clerk-e2e
        env:
          CLERK_TEST_PUBLISHABLE_KEY: ${{ secrets.CLERK_TEST_PUBLISHABLE_KEY }}
          CLERK_TEST_SECRET_KEY: ${{ secrets.CLERK_TEST_SECRET_KEY }}
        run: |
          if [ -n "$CLERK_TEST_PUBLISHABLE_KEY" ] && [ -n "$CLERK_TEST_SECRET_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.clerk-e2e.outputs.enabled == 'true'
        run: pnpm exec playwright install --with-deps chromium
      - if: steps.clerk-e2e.outputs.enabled == 'true'
        run: pnpm test:e2e
